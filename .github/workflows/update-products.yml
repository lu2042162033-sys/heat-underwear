name: Update Products (Admin)

on:
  repository_dispatch:
    types: [update-products, check-password]

permissions:
  contents: write
  pages: write
  id-token: write

# 与 deploy.yml 共用 pages 组，避免两次发布互相打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 使用仓库自带的 GITHUB_TOKEN：不再依赖会到期的 DEPLOY_TOKEN
      - uses: actions/checkout@v4

      - name: Verify admin password
        id: auth
        env:
          EXPECTED: ${{ secrets.ADMIN_PASSWORD }}
          GIVEN: ${{ github.event.client_payload.password }}
        run: |
          if [ "$GIVEN" = "$EXPECTED" ] && [ -n "$GIVEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply pending products (extract images + compact data)
        if: steps.auth.outputs.ok == 'true' && github.event.action == 'update-products'
        run: |
          python3 .github/scripts/extract_images.py

      - name: Write auth result
        env:
          REQ: ${{ github.event.client_payload.request_id }}
          OK: ${{ steps.auth.outputs.ok }}
        run: |
          mkdir -p w/outputs/site/data
          printf '{"request_id":"%s","valid":%s,"ts":"%s"}' "$REQ" "$OK" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > w/outputs/site/data/admin-auth.json
          echo "auth result written: valid=$OK"

      - name: Commit and push
        id: commit
        run: |
          git config user.name "heat-site-bot"
          git config user.email "heat-site-bot@users.noreply.github.com"
          git add w/outputs/site/data w/outputs/site/images/products
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: admin update"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 用 GITHUB_TOKEN 提交的推送不会触发 deploy.yml，因此在同一工作流内直接发布 Pages
      - name: Prepare site files
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp -r w/outputs/site/* _site/
          rm -f _site/data/pending-products.json

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
